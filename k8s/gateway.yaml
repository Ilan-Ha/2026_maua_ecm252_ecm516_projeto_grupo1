apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: allforone
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: gateway
              containerPort: 10000
              hostPort: 10000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-clusterip-service
  namespace: allforone
  labels:
    app: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      protocol: TCP
      port: 10000
      targetPort: 10000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-nodeport-service
  namespace: allforone
  labels:
    app: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: gateway
      protocol: TCP
      port: 10000
      targetPort: 10000