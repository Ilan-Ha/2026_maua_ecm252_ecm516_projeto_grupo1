apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: allforone
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 10000
              hostPort: 10000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: allforone
  labels:
    app: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 10000
      targetPort: 10000
