apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-bus
  namespace: allforone
  labels:
    app: request-bus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: request-bus
  template:
    metadata:
      labels:
        app: request-bus
    spec:
      containers:
        - name: request-bus
          image: request-bus:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 10002
              hostPort: 10002
---
apiVersion: v1
kind: Service
metadata:
  name: request-bus
  namespace: allforone
  labels:
    app: request-bus
spec:
  type: ClusterIP
  selector:
    app: request-bus
  ports:
    - name: http
      port: 10002
      targetPort: 10002
