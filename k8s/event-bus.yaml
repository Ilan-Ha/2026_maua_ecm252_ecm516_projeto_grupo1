apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-bus-deployment
  namespace: allforone
  labels:
    app: event-bus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-bus
  template:
    metadata:
      labels:
        app: event-bus
    spec:
      containers:
        - name: event-bus
          image: event-bus:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: event-bus
              containerPort: 10001
              hostPort: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: event-bus-clusterip-service
  namespace: allforone
  labels:
    app: event-bus
spec:
  type: ClusterIP
  selector:
    app: event-bus
  ports:
    - name: event-bus
      protocol: TCP
      port: 10001
      targetPort: 10001
