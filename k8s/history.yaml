apiVersion: apps/v1
kind: Deployment
metadata:
  name: history-deployment
  namespace: allforone
  labels:
    app: history
spec:
  replicas: 1
  selector:
    matchLabels:
      app: history
  template:
    metadata:
      labels:
        app: history
    spec:
      containers:
        - name: history
          image: history:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: history
              containerPort: 3005
              hostPort: 3005
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo
                  key: MONGO_URI
---
apiVersion: v1
kind: Service
metadata:
  name: history-cluesterip-service
  namespace: allforone
  labels:
    app: history
spec:
  type: ClusterIP
  selector:
    app: history
  ports:
    - name: history
      protocol: TCP
      port: 3005
      targetPort: 3005
